<style>
  :root{
    --bg:#f1f5f9; --surface:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    --accent:#1e3a5f; --accent-2:#2563eb;
    --green:#16a34a; --green-bg:#dcfce7;
    --amber:#d97706; --amber-bg:#fef3c7;
    --red:#dc2626; --red-bg:#fee2e2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text);
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,#0f172a,#1e3a5f);
    color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  }
  header h1{margin:0 0 10px; font-size:19px; font-weight:700; display:flex; align-items:center; gap:8px;}
  header h1 .logo{width:26px;height:26px;border-radius:7px;overflow:hidden;flex:none;}
  header h1 .logo img{width:100%;height:100%;display:block;}
  .searchbox{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:10px 12px;
  }
  .searchbox svg{flex:none; opacity:.85;}
  .searchbox input{
    flex:1; border:none; outline:none; background:transparent; color:#fff;
    font-size:16px;
  }
  .searchbox input::placeholder{color:rgba(255,255,255,.6);}
  .searchbox button{
    background:transparent;border:none;color:rgba(255,255,255,.75);font-size:18px;
    display:none; padding:0 2px; cursor:pointer;
  }

  .chiprow{display:flex; gap:8px; overflow-x:auto; padding:10px 16px 0; scrollbar-width:none;}
  .chiprow::-webkit-scrollbar{display:none;}
  .chip{
    flex:none; padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600;
    border:1px solid var(--border); background:var(--surface); color:var(--muted);
    cursor:pointer; white-space:nowrap; user-select:none;
  }
  .chip.active{background:var(--accent-2); border-color:var(--accent-2); color:#fff;}

  .summary{
    margin:12px 16px 0; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .pill{
    font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:10px;
    display:flex; align-items:center; gap:6px;
  }
  .pill.total{background:#e2e8f0; color:var(--text);}
  .pill.warn{background:var(--red-bg); color:var(--red); cursor:pointer; border:1px solid transparent;}
  .pill.warn.active{border-color:var(--red);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.g{background:var(--green);} .dot.a{background:var(--amber);} .dot.r{background:var(--red);}

  main{padding:12px 16px 32px;}
  .list{display:flex; flex-direction:column; gap:10px;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:12px 14px; display:flex; gap:12px; align-items:center; cursor:pointer;
    transition:box-shadow .15s;
  }
  .card:active{box-shadow:inset 0 0 0 2px var(--accent-2);}
  .card .semaforo{width:12px;height:12px;border-radius:50%;flex:none; box-shadow:0 0 0 3px rgba(0,0,0,.03);}
  .card .body{flex:1; min-width:0;}
  .card .tag{font-weight:700; font-size:15px; letter-spacing:.2px;}
  .card .desc{color:var(--muted); font-size:13.5px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card .meta{margin-top:6px; display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:600; padding:2px 7px; border-radius:6px; background:#f1f5f9; color:var(--muted);}
  .badge.cald{background:#e0e7ff; color:#3730a3;}
  .card .qty{flex:none; text-align:right; font-size:12px; color:var(--muted); min-width:44px;}
  .card .qty b{display:block; font-size:16px; color:var(--text);}

  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}
  .loading{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px;}

  .overlay{
    position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:40;
    display:none; align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; max-width:560px; max-height:88vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:0 0 calc(env(safe-area-inset-bottom) + 20px);
    animation:up .18s ease-out;
  }
  @keyframes up{from{transform:translateY(24px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
  .sheet-head{
    position:sticky; top:0; background:var(--surface); z-index:2;
    padding:16px 16px 10px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
  }
  .sheet-head .grabber{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:36px; height:4px; background:var(--border); border-radius:99px;}
  .sheet-head h2{margin:6px 0 4px; font-size:19px;}
  .sheet-head p{margin:0; color:var(--muted); font-size:13.5px;}
  .closebtn{background:#f1f5f9; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--muted); cursor:pointer; flex:none;}

  .section{padding:14px 16px;}
  .section h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;}
  .field{min-width:0;}
  .field label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:2px;}
  .field .val{font-size:14.5px; word-break:break-word;}
  .field .val.empty-val{color:#cbd5e1; font-style:italic;}
  .comentario{background:#fffbeb; border:1px solid #fde68a; border-radius:10px; padding:10px 12px; font-size:13.5px; color:#92400e; margin-top:4px;}

  .stockbox{
    border-radius:14px; padding:14px; margin-top:2px;
  }
  .stockbox.g{background:var(--green-bg);}
  .stockbox.a{background:var(--amber-bg);}
  .stockbox.r{background:var(--red-bg);}
  .stockrow{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .stockrow .sdot{width:14px;height:14px;border-radius:50%;flex:none;}
  .stockrow .slabel{font-weight:700; font-size:15px;}
  .stockrow .slabel small{display:block; font-weight:500; font-size:12px; color:var(--muted);}

  .editgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .editgrid .full{grid-column:1 / -1;}
  .editgrid label{display:block; font-size:11.5px; color:var(--muted); margin-bottom:4px;}
  .editgrid input{
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid var(--border);
    font-size:15px; background:#fff;
  }
  .savebar{display:flex; gap:10px; margin-top:12px;}
  .btn{
    flex:1; border:none; border-radius:10px; padding:11px; font-size:14.5px; font-weight:700; cursor:pointer;
  }
  .btn.primary{background:var(--accent-2); color:#fff;}
  .btn.primary:disabled{background:#93c5fd; cursor:default;}
  .btn.ghost{background:#e2e8f0; color:var(--text); flex:none; padding:11px 16px;}
  .savedmsg{font-size:12.5px; color:var(--green); margin-top:8px; display:none; font-weight:600;}
  .savedmsg.show{display:block;}

  .installbar{
    margin:12px 16px 0; background:#eef2ff; border:1px solid #c7d2fe; border-radius:12px;
    padding:10px 12px; font-size:12.5px; color:#3730a3; display:flex; gap:8px; align-items:flex-start;
  }
  .installbar button{
    margin-left:auto; background:none; border:none; color:#3730a3; font-size:16px; cursor:pointer; flex:none;
  }
  .updflash{transition:background-color .6s ease;}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const SUPABASE_URL = "https://edkqfngzillrhscrykid.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVka3Fmbmd6aWxscmhzY3J5a2lkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMDY4NDUsImV4cCI6MjEwMjY4Mjg0NX0.-PZ5zLFbXyA6O1inHqR0HOj83NdcqbZfX1dXh9lskP8";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let ITEMS = [];
let filtroCaldera = "Todas";
let filtroCategoria = "Todas";
let soloSinStock = false;
let searchTerm = "";
let openId = null;

const norm = s => (s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"");

function estado(item){
  const c = item.cantidad ?? 0;
  const m = item.stock_minimo ?? 1;
  if (c <= 0) return {k:'r', label:'Sin stock', color:'r'};
  if (c < m) return {k:'a', label:'Stock bajo', color:'a'};
  return {k:'g', label:'Stock OK', color:'g'};
}

function fieldVal(v){
  return (v === null || v === undefined || v === '') ? '<span class="val empty-val">—</span>' : `<span class="val">${escapeHtml(v)}</span>`;
}
function escapeHtml(v){
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const CALDERA_ORDER = ["1","2","3","2 y 3","Planta"];
const CALDERA_LABEL = {"1":"Caldera 1","2":"Caldera 2","3":"Caldera 3","2 y 3":"Calderas 2 y 3","Planta":"Planta general"};

function buildChips(){
  const caldSet = new Set(ITEMS.map(i=>i.caldera).filter(Boolean));
  const calds = CALDERA_ORDER.filter(c=>caldSet.has(c));
  const cEl = document.getElementById('chips-caldera');
  cEl.innerHTML = '';
  const todas = chipEl('Todas', filtroCaldera==='Todas', ()=>{filtroCaldera='Todas'; buildChips(); render();});
  cEl.appendChild(todas);
  calds.forEach(c=>{
    cEl.appendChild(chipEl(CALDERA_LABEL[c]||c, filtroCaldera===c, ()=>{filtroCaldera=c; buildChips(); render();}));
  });

  const catSet = [...new Set(ITEMS.map(i=>i.categoria).filter(Boolean))].sort();
  const catEl = document.getElementById('chips-categoria');
  catEl.innerHTML = '';
  catEl.appendChild(chipEl('Todas las categorías', filtroCategoria==='Todas', ()=>{filtroCategoria='Todas'; buildChips(); render();}));
  catSet.forEach(c=>{
    catEl.appendChild(chipEl(c, filtroCategoria===c, ()=>{filtroCategoria=c; buildChips(); render();}));
  });
}
function chipEl(label, active, onClick){
  const d = document.createElement('div');
  d.className = 'chip' + (active?' active':'');
  d.textContent = label;
  d.onclick = onClick;
  return d;
}

function filtered(){
  const t = norm(searchTerm);
  return ITEMS.filter(i=>{
    if (filtroCaldera!=='Todas' && i.caldera !== filtroCaldera) return false;
    if (filtroCategoria!=='Todas' && i.categoria !== filtroCategoria) return false;
    if (soloSinStock && estado(i).k === 'g') return false;
    if (!t) return true;
    const hay = [i.tag,i.descripcion,i.marca,i.modelo,i.ubicacion,i.codigo_repuesto,i.numero_serie]
      .map(norm).join(' ');
    return hay.includes(t);
  });
}

function render(){
  const list = document.getElementById('list');
  const items = filtered();
  document.getElementById('pill-total').textContent = `${items.length} resultado${items.length===1?'':'s'}`;
  const warnCount = ITEMS.filter(i=>estado(i).k!=='g').length;
  document.getElementById('warn-count').textContent = warnCount;

  if (!items.length){
    list.innerHTML = '<div class="empty">No se encontraron instrumentos con ese criterio.</div>';
    return;
  }
  list.innerHTML = items.map(i=>{
    const e = estado(i);
    const color = e.k==='r' ? 'var(--red)' : e.k==='a' ? 'var(--amber)' : 'var(--green)';
    return `<div class="card" data-id="${i.id}">
      <div class="semaforo" style="background:${color}"></div>
      <div class="body">
        <div class="tag">${escapeHtml(i.tag || '(sin tag)')}</div>
        <div class="desc">${escapeHtml(i.descripcion || 'Sin descripción')}</div>
        <div class="meta">
          ${i.caldera ? `<span class="badge cald">${escapeHtml(CALDERA_LABEL[i.caldera]||i.caldera)}</span>`:''}
          ${i.categoria ? `<span class="badge">${escapeHtml(i.categoria)}</span>`:''}
          ${i.ubicacion ? `<span class="badge">${escapeHtml(i.ubicacion)}</span>`:''}
        </div>
      </div>
      <div class="qty"><b>${i.cantidad ?? 0}</b>u.</div>
    </div>`;
  }).join('');
  [...list.querySelectorAll('.card')].forEach(c=>{
    c.addEventListener('click', ()=> openDetail(c.dataset.id));
  });
}

function openDetail(id){
  openId = id;
  const i = ITEMS.find(x=>String(x.id)===String(id));
  if (!i) return;
  const e = estado(i);
  const stockClass = e.k;
  const overlay = document.getElementById('overlay');
  const sheet = document.getElementById('sheet');
  sheet.innerHTML = `
    <div class="sheet-head">
      <div class="grabber"></div>
      <div>
        <h2>${escapeHtml(i.tag || '(sin tag)')}</h2>
        <p>${escapeHtml(i.descripcion || 'Sin descripción')}</p>
      </div>
      <button class="closebtn" id="sheet-close">✕</button>
    </div>

    <div class="section">
      <h3>Stock</h3>
      <div class="stockbox ${stockClass}" id="stockbox">
        <div class="stockrow">
          <div class="sdot" style="background:${stockClass==='r'?'var(--red)':stockClass==='a'?'var(--amber)':'var(--green)'}"></div>
          <div class="slabel" id="stocklabel">${e.label}
            <small id="stocksub">${i.cantidad ?? 0} unidad(es) · mínimo ${i.stock_minimo ?? 1}</small>
          </div>
        </div>
        <div class="editgrid">
          <div>
            <label>Cantidad en stock</label>
            <input type="number" min="0" id="edit-cantidad" value="${i.cantidad ?? 0}">
          </div>
          <div>
            <label>Stock mínimo</label>
            <input type="number" min="0" id="edit-minimo" value="${i.stock_minimo ?? 1}">
          </div>
          <div>
            <label>Ubicación en bodega</label>
            <input type="text" id="edit-bodega" value="${(i.ubicacion_bodega||'').replace(/"/g,'&quot;')}" placeholder="Ej: Estante A-3">
          </div>
          <div>
            <label>Proveedor</label>
            <input type="text" id="edit-proveedor" value="${(i.proveedor||'').replace(/"/g,'&quot;')}" placeholder="Ej: Smar Chile">
          </div>
        </div>
        <div class="savebar">
          <button class="btn primary" id="save-btn">Guardar cambios</button>
        </div>
        <div class="savedmsg" id="saved-msg">✓ Guardado. Todos verán el cambio al instante.</div>
      </div>
    </div>

    <div id="caract-container"></div>

    <div class="section" style="padding-top:0;">
      <h3>Origen del dato</h3>
      <div class="grid">
        <div class="field"><label>Planilla origen</label>${fieldVal(i.hoja_origen)}</div>
        <div class="field"><label>Última actualización</label>${fieldVal(i.updated_at ? new Date(i.updated_at).toLocaleString('es-CL') : null)}</div>
      </div>
    </div>
  `;
  overlay.classList.add('open');
  document.getElementById('sheet-close').onclick = closeDetail;
  document.getElementById('save-btn').onclick = ()=> saveStock(i.id);
  renderCaract(i, false);
}

      <div class="section">
        <h3>Ubicación y clasificación</h3>
        <div class="grid">
          <div class="field"><label>Caldera</label>${fieldVal(CALDERA_LABEL[i.caldera]||i.caldera)}</div>
          <div class="field"><label>Categoría</label>${fieldVal(i.categoria)}</div>
          <div class="field"><label>Ubicación física</label>${fieldVal(i.ubicacion)}</div>
          <div class="field"><label>Variable de control</label>${fieldVal(i.variable_control)}</div>
        </div>
      </div>
      <div class="section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
          <h3 style="margin:0;">Ficha técnica</h3>
          <button class="btn ghost" id="edit-caract-btn" style="flex:none; padding:6px 12px; font-size:12.5px;">🔒 Editar</button>
        </div>
        <div class="grid">
          <div class="field"><label>Descripción</label>${fieldVal(i.descripcion)}</div>
          <div class="field"><label>Marca</label>${fieldVal(i.marca)}</div>
          <div class="field"><label>Modelo</label>${fieldVal(i.modelo)}</div>
          <div class="field"><label>N° de serie</label>${fieldVal(i.numero_serie)}</div>
          <div class="field"><label>Código repuesto</label>${fieldVal(i.codigo_repuesto)}</div>
          <div class="field"><label>Tipo de sensor</label>${fieldVal(i.tipo_sensor)}</div>
          <div class="field"><label>Función</label>${fieldVal(i.funcion)}</div>
          <div class="field"><label>Setpoint</label>${fieldVal(i.setpoint)}</div>
          <div class="field"><label>Reset</label>${fieldVal(i.reset_valor)}</div>
          <div class="field"><label>N° de contacto</label>${fieldVal(i.numero_contacto)}</div>
          <div class="field"><label>Damping</label>${fieldVal(i.damping)}</div>
          <div class="field"><label>Solicitud de compra</label>${fieldVal(i.solicitud_compra)}</div>

  } else {

    el.innerHTML = `
      <div class="section">
        <h3 style="margin:0 0 10px;">Editar características</h3>
        <div class="editgrid">
          <div class="full"><label>Descripción</label><input id="ec-descripcion" value="${v(i.descripcion)}"></div>
          <div><label>Caldera</label><input id="ec-caldera" value="${v(i.caldera)}" placeholder="1 / 2 / 3 / 2 y 3 / Planta"></div>
          <div><label>Categoría</label><input id="ec-categoria" value="${v(i.categoria)}"></div>
          <div><label>Ubicación física</label><input id="ec-ubicacion" value="${v(i.ubicacion)}"></div>
          <div><label>Variable de control</label><input id="ec-variable_control" value="${v(i.variable_control)}"></div>
          <div><label>Marca</label><input id="ec-marca" value="${v(i.marca)}"></div>
          <div><label>Modelo</label><input id="ec-modelo" value="${v(i.modelo)}"></div>
          <div><label>N° de serie</label><input id="ec-numero_serie" value="${v(i.numero_serie)}"></div>
          <div><label>Código repuesto</label><input id="ec-codigo_repuesto" value="${v(i.codigo_repuesto)}"></div>
          <div><label>Tipo de sensor</label><input id="ec-tipo_sensor" value="${v(i.tipo_sensor)}"></div>
          <div><label>Función</label><input id="ec-funcion" value="${v(i.funcion)}"></div>
          <div><label>Setpoint</label><input id="ec-setpoint" value="${v(i.setpoint)}"></div>
          <div><label>Reset</label><input id="ec-reset_valor" value="${v(i.reset_valor)}"></div>
          <div><label>N° de contacto</label><input id="ec-numero_contacto" value="${v(i.numero_contacto)}"></div>
          <div><label>Damping</label><input id="ec-damping" value="${v(i.damping)}"></div>

let editUnlocked = false;
function checkPassword(){
  if (editUnlocked) return true;
  const pass = prompt('Ingresa la clave:');
  if (pass === null) return false;
  if (pass !== 'Cpp1234'){
    alert('Clave incorrecta.');
    return false;
  }
  editUnlocked = true;
  return true;
}
function tryUnlockEdit(i){
  if (!checkPassword()) return;
  renderCaract(i, true);
}


async function saveCaract(id){
  const btn = document.getElementById('ec-save-btn');
  const val = (fid)=> { const el = document.getElementById(fid); const t = el.value.trim(); return t === '' ? null : t; };
  const updates = {
    descripcion: val('ec-descripcion'),
    caldera: val('ec-caldera'),
    categoria: val('ec-categoria'),
    ubicacion: val('ec-ubicacion'),
    variable_control: val('ec-variable_control'),
    marca: val('ec-marca'),
    modelo: val('ec-modelo'),
    numero_serie: val('ec-numero_serie'),
    codigo_repuesto: val('ec-codigo_repuesto'),
    tipo_sensor: val('ec-tipo_sensor'),
    funcion: val('ec-funcion'),
    setpoint: val('ec-setpoint'),
    reset_valor: val('ec-reset_valor'),
    numero_contacto: val('ec-numero_contacto'),
    damping: val('ec-damping'),
    solicitud_compra: val('ec-solicitud_compra'),
    ultima_verificacion: val('ec-ultima_verificacion'),
    comentario: val('ec-comentario'),
  };
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('instrumentos').update(updates).eq('id', id);
  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  document.getElementById('ec-saved-msg').classList.add('show');
  setTimeout(()=>{
    const i2 = ITEMS.find(x=>String(x.id)===String(id));
    if (i2) renderCaract(i2, false);
  }, 900);
}
function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
  openId = null;
}
document.getElementById('overlay').addEventListener('click', (e)=>{
  if (e.target.id === 'overlay') closeDetail();
});

async function saveStock(id){
  if (!checkPassword()) return;
  const btn = document.getElementById('save-btn');
  const cantidad = parseInt(document.getElementById('edit-cantidad').value || '0', 10);
  const stock_minimo = parseInt(document.getElementById('edit-minimo').value || '1', 10);
  const ubicacion_bodega = document.getElementById('edit-bodega').value.trim() || null;
  const proveedor = document.getElementById('edit-proveedor').value.trim() || null;
  btn.disabled = true; btn.textContent = 'Guardando…';
  const { error } = await sb.from('instrumentos')
    .update({ cantidad, stock_minimo, ubicacion_bodega, proveedor })
    .eq('id', id);
  btn.disabled = false; btn.textContent = 'Guardar cambios';
  if (error){
    alert('No se pudo guardar: ' + error.message);
    return;
  }
  document.getElementById('saved-msg').classList.add('show');
  setTimeout(()=> document.getElementById('saved-msg').classList.remove('show'), 2500);
  // el propio realtime actualizará ITEMS y la vista
}

function applyRemoteChange(row){
  const idx = ITEMS.findIndex(x=>String(x.id)===String(row.id));
  if (idx>=0) ITEMS[idx] = row; else ITEMS.push(row);
  buildChips();
  render();
  if (openId && String(openId)===String(row.id)){
    openDetail(row.id);
  }
}

async function loadAll(){
  const { data, error } = await sb.from('instrumentos').select('*').order('tag', {ascending:true, nullsFirst:false});
  if (error){
    document.getElementById('list').innerHTML = '<div class="empty">Error al cargar datos: '+escapeHtml(error.message)+'</div>';
    return;
  }
  ITEMS = data || [];
  buildChips();
  render();
}

document.getElementById('q').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  document.getElementById('qclear').style.display = searchTerm ? 'block' : 'none';
  render();
});
document.getElementById('qclear').addEventListener('click', ()=>{
  searchTerm=''; document.getElementById('q').value=''; document.getElementById('qclear').style.display='none'; render();
});
document.getElementById('pill-warn').addEventListener('click', ()=>{
  soloSinStock = !soloSinStock;
  document.getElementById('pill-warn').classList.toggle('active', soloSinStock);
  render();
});
document.getElementById('pill-download').addEventListener('click', descargarExcel);

function descargarExcel(){
  if (!ITEMS.length){ alert('Todavía no hay datos cargados, espera un segundo e intenta de nuevo.'); return; }
  if (!window.XLSX){ alert('No se pudo cargar el generador de Excel. Revisa tu conexión a internet e intenta de nuevo.'); return; }
  const headers = ['Tag','Descripción','Ubicación','Caldera','Categoría','Variable de control','Tipo de sensor','Setpoint','Reset','N° de contacto','Marca','Modelo','N° de serie','Código repuesto','Función','Damping','Solicitud de compra','Última verificación','Comentario','Hoja origen','Cantidad','Stock mínimo','Ubicación bodega','Proveedor','Última actualización'];
  const rows = [...ITEMS].sort((a,b)=> (a.tag||'').localeCompare(b.tag||'')).map(i => [
    i.tag, i.descripcion, i.ubicacion, i.caldera, i.categoria, i.variable_control, i.tipo_sensor,
    i.setpoint, i.reset_valor, i.numero_contacto, i.marca, i.modelo, i.numero_serie, i.codigo_repuesto,
    i.funcion, i.damping, i.solicitud_compra, i.ultima_verificacion, i.comentario, i.hoja_origen,
    i.cantidad ?? 0, i.stock_minimo ?? 1, i.ubicacion_bodega, i.proveedor,
    i.updated_at ? new Date(i.updated_at).toLocaleString('es-CL') : ''
  ]);
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = headers.map(()=>({wch:18}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Instrumentos');
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `instrumentos_${fecha}.xlsx`);
}
document.getElementById('install-close').addEventListener('click', ()=>{
  document.getElementById('installbar').style.display='none';
  try{ localStorage.setItem('installbar-dismissed','1'); }catch(e){}
});
try{ if (localStorage.getItem('installbar-dismissed')) document.getElementById('installbar').style.display='none'; }catch(e){}

loadAll();

sb.channel('instrumentos-realtime')
  .on('postgres_changes', {event:'*', schema:'public', table:'instrumentos'}, (payload)=>{
    if (payload.new && payload.new.id) applyRemoteChange(payload.new);
  })
  .subscribe();
</script>
